server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: irms-roadshow

# ===== CAS 配置 =====
cas:
  server:
    # CAS Server 登录地址
    login-url: https://cas.csc.com.cn/cas/login
    # CAS Server 登出地址
    logout-url: https://cas.csc.com.cn/cas/logout
    # CAS Server ticket 验证地址（CAS 3.0 协议使用 /p3/serviceValidate）
    validate-url: https://cas.csc.com.cn/cas/p3/serviceValidate
  client:
    # 本服务的地址，CAS 登录成功后会回调到这里
    service-url: https://irms-roadshow-test.csc.com.cn

# ===== JWT 配置 =====
jwt:
  # 生产环境务必更换为安全的随机密钥（至少 256 bit）
  secret: Y2hhbmdlLXRoaXMtdG8tYS1zZWN1cmUtcmFuZG9tLWtleS1pbi1wcm9kdWN0aW9u
  # token 过期时间（秒），默认 8 小时
  expiration: 28800

# ===== 前端地址（CORS 白名单） =====
app:
  frontend-url: http://localhost:8080
